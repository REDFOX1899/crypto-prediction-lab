[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
kalshi-client = { path = "../../crates/kalshi-client" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
